<!-- ==========================================

<div id="px-splash-wrapper" class="px-splash-wrapper">

<header class="px-h-wrapper" id="pxHeader">
  <div class="px-h-container">

    <div class="px-h-profile">
      <div class="px-h-avatar-ring">

<!-- HERO (Adjusted padding-top to clear the fixed header) -->
<section id="home" class="relative min-h-screen flex items-center pt-32 pb-16 overflow-hidden">
  <div class="hero-bg"></div>
  <div class="grid-bg"></div>
  <div class="relative z-10 max-w-6xl mx-auto px-6 grid md:grid-cols-2 gap-12 items-center w-full">
    <div>
      <div class="inline-flex items-center gap-2 chip mb-6">
        <span class="dot"></span>
        <span>Open to Cyber & Marketing Roles</span>
      </div>
      

<script>
  // ==========================================
  // 1. ISOLATED SPLASH SCREEN LOGIC (4 Seconds)
  // ==========================================
  document.addEventListener('DOMContentLoaded', () => {
    const splashWrapper = document.getElementById('px-splash-wrapper');
    const typingElement = document.getElementById('px-splash-typing');
    
    document.body.style.overflow = 'hidden'; // Lock scroll

    const textToType = "Initializing PritomX Cyber Hub...";
    let charIndex = 0;
    const typeInterval = setInterval(() => {
      if (charIndex < textToType.length) {
        typingElement.textContent += textToType.charAt(charIndex);
        charIndex++;
      } else {
        clearInterval(typeInterval);
      }
    }, 40);

    setTimeout(() => {
      splashWrapper.classList.add('px-splash-hidden');
      setTimeout(() => {
        if (splashWrapper && splashWrapper.parentNode) {
          splashWrapper.remove();
        }
        document.body.style.overflow = ''; // Unlock scroll
      }, 800);
    }, 4000);
  });

  // ==========================================
  // 2. ISOLATED HEADER LOGIC (Scroll & Mobile)
  // ==========================================
  const pxHeader = document.getElementById('pxHeader');
  const pxMobileToggle = document.getElementById('pxMobileToggle');
  const pxMobileMenu = document.getElementById('pxMobileMenu');
  const pxMobileLinks = document.querySelectorAll('.px-h-mobile-link');

  // Scroll effect for header
  window.addEventListener('scroll', () => {
    if (window.scrollY > 50) {
      pxHeader.classList.add('px-h-scrolled');
    } else {
      pxHeader.classList.remove('px-h-scrolled');
    }
  });

  // Mobile menu toggle
  pxMobileToggle.addEventListener('click', () => {
    pxMobileMenu.classList.toggle('px-h-open');
  });

  // Close mobile menu when a link is clicked
  pxMobileLinks.forEach(link => {
    link.addEventListener('click', () => {
      pxMobileMenu.classList.remove('px-h-open');
    });
  });

  // Active link highlighting on scroll
  const sections = document.querySelectorAll('section[id]');
  const pxNavLinks = document.querySelectorAll('.px-h-link');
  
  window.addEventListener('scroll', () => {
    let current = '';
    sections.forEach(section => {
      const sectionTop = section.offsetTop - 150;
      if (window.scrollY >= sectionTop) {
        current = section.getAttribute('id');
      }
    });
    pxNavLinks.forEach(link => {
      link.classList.remove('px-h-active');
      if (link.getAttribute('href') === '#' + current) {
        link.classList.add('px-h-active');
      }
    });
  });

  // ==========================================
  // 3. ORIGINAL SITE SCRIPTS (Untouched)
  // ==========================================
  // Reveal on scroll
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.classList.add('visible');
        e.target.querySelectorAll('.skill-fill').forEach(b=>{
          b.style.width = b.dataset.w;
        });
        io.unobserve(e.target);
      }
    });
  },{threshold:0.12});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

  // Card mouse glow (Cyber Effect)
  document.querySelectorAll('.glow-card').forEach(card=>{
    card.addEventListener('mousemove',e=>{
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx',(e.clientX-r.left)+'px');
      card.style.setProperty('--my',(e.clientY-r.top)+'px');
    });
  });

  // Contact form
  document.getElementById('contactForm').addEventListener('submit',e=>{
    e.preventDefault();
    const msg = document.getElementById('formMsg');
    msg.classList.remove('hidden');
    e.target.reset();
    setTimeout(()=>msg.classList.add('hidden'),4000);
  });
</script>
</body>
</html>
